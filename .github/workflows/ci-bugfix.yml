name: CI (bugfix -> migration-backend)

on:
  push:
    branches:
      - "bugfix/**"
      - "fix/**"
  workflow_dispatch:

concurrency:
  group: ci-bugfix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Governance check
        run: bun run governance:check

  migration-tests:
    name: Migration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Migration regression tests
        run: bun run test:migration

  contract-artifacts:
    name: OpenAPI / Collections Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Validate generated API artifacts
        run: bun run artifacts:check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - quality
      - migration-tests
      - contract-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3000/api/v1/cheffia' }}
          NEXT_PUBLIC_API_URL_WEBSOCKET: ${{ secrets.NEXT_PUBLIC_API_URL_WEBSOCKET || 'ws://localhost:3000/api/v1/cheffia' }}
          NEXT_PUBLIC_WEBSOCKET_URL: ${{ secrets.NEXT_PUBLIC_WEBSOCKET_URL || 'ws://localhost:3000/api/v1/cheffia' }}
          NEXT_PUBLIC_SUPABASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SUPABASE_PROJECT_ID || 'placeholder-project' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_placeholder' }}
        run: bun run build

  auto-pr-to-migration-backend:
    name: Open PR to migration-backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: Create PR if not exists (bugfix -> migration-backend)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'migration-backend';

            const prs = await github.rest.pulls.list({
              owner, repo,
              head: `${owner}:${head}`,
              base,
              state: 'open',
              per_page: 1,
            });

            if (prs.data.length > 0) {
              core.info(`PR já existe: #${prs.data[0].number} ${prs.data[0].html_url}`);
              return;
            }

            const title = `fix: ${head.replace(/^bugfix\//,'').replace(/^fix\//,'')}`;
            const body = [
              '## PR automático (bugfix -> migration-backend)',
              '',
              `**Head:** \`${head}\``,
              `**Base:** \`${base}\``,
              '',
              '- [ ] Lint/Typecheck passaram?',
              '- [ ] Build passou?',
              '- [ ] Critérios de multi-tenant e idempotência respeitados?',
              '',
              '*Criado automaticamente pelo GitHub Actions.*'
            ].join('\n');

            const res = await github.rest.pulls.create({
              owner, repo,
              head,
              base,
              title,
              body,
              maintainer_can_modify: true,
            });

            core.info(`PR criado: #${res.data.number} ${res.data.html_url}`);
