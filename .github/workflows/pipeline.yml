name: Cheffia CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["develop", "release", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cheffia-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  branch-policy:
    name: Validate branch flow
    runs-on: ubuntu-latest
    steps:
      - name: Enforce feature/bugfix → develop → release → main
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.base_ref }}"
          head="${{ github.head_ref }}"

          case "${base}:${head}" in
            develop:feature/*|develop:bugfix/*)
              echo "Valid promotion: ${head} -> develop"
              ;;
            release:develop)
              echo "Valid promotion: develop -> release"
              ;;
            main:release)
              echo "Valid promotion: release -> main"
              ;;
            *)
              echo "Invalid promotion: ${head} -> ${base}"
              echo "Allowed: feature/* or bugfix/* -> develop -> release -> main"
              exit 1
              ;;
          esac
      - name: Branch flow not applicable
        if: github.event_name != 'pull_request'
        run: echo "Push/workflow_dispatch does not require promotion validation."

  quality:
    name: Quality gates
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'github-actions[bot]'
    needs: branch-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.109.1"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate Prisma schema
        run: bun run prisma:validate
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Component tests
        run: bun run test:components
      - name: Backend coverage
        run: bun run test:backend:coverage
      - name: Frontend coverage
        run: bun run test:frontend:coverage
      - name: Install Playwright Chromium
        run: bunx playwright install chromium
      - name: E2E smoke tests
        run: bun run test:e2e
      - name: E2E coverage with local fixtures
        run: bun run test:e2e:coverage:local
      - name: Enforce 90 percent coverage in every test layer
        run: bun run coverage:gate
      - name: Lint
        run: bun run lint
      - name: Build application
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ci-placeholder
          STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_API_URL_WEBSOCKET: ws://127.0.0.1:3001
          NEXT_PUBLIC_DISCORD_WEBHOOK_URL: http://127.0.0.1
          NEXT_PUBLIC_DISCORD_WEBHOOK_CHEFFIA_ASK: http://127.0.0.1
          NEXT_PUBLIC_DISCORD_WEBHOOK_CHEFFIA_WAITLIST: http://127.0.0.1
        run: bun run build

  database:
    name: Local database and RLS
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'github-actions[bot]'
    needs: branch-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.109.1"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Reset local database
        run: bun run db:reset
      - name: Verify foundation isolation and migration tracking
        run: bun run db:verify

  promote-feature-to-develop:
    name: Promote feature/bugfix to develop
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/heads/feature/') ||
      startsWith(github.ref, 'refs/heads/bugfix/'))
    needs: [quality, database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create promotion pull request if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          TARGET_BRANCH: develop
        shell: bash
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list \
            --repo "${GH_REPOSITORY}" \
            --head "${HEAD_BRANCH}" \
            --base "${TARGET_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [[ -n "${existing_pr}" ]]; then
            echo "Promotion PR #${existing_pr} already exists: ${HEAD_BRANCH} -> ${TARGET_BRANCH}"
            exit 0
          fi

          gh pr create \
            --repo "${GH_REPOSITORY}" \
            --head "${HEAD_BRANCH}" \
            --base "${TARGET_BRANCH}" \
            --title "Promote ${HEAD_BRANCH} to ${TARGET_BRANCH}" \
            --body "Automated promotion for commit ${COMMIT_SHA}. CI checks passed on ${HEAD_BRANCH}."

  promote-develop-to-release:
    name: Promote develop to release
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [quality, database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create promotion pull request if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          TARGET_BRANCH: release
        shell: bash
        run: |
          set -euo pipefail
          existing_pr="$(gh pr list --repo "${GH_REPOSITORY}" --head "${HEAD_BRANCH}" --base "${TARGET_BRANCH}" --state open --json number --jq '.[0].number')"
          if [[ -n "${existing_pr}" ]]; then
            echo "Promotion PR #${existing_pr} already exists: ${HEAD_BRANCH} -> ${TARGET_BRANCH}"
            exit 0
          fi
          gh pr create --repo "${GH_REPOSITORY}" --head "${HEAD_BRANCH}" --base "${TARGET_BRANCH}" --title "Promote ${HEAD_BRANCH} to ${TARGET_BRANCH}" --body "Automated promotion for commit ${COMMIT_SHA}. CI checks passed on ${HEAD_BRANCH}."

  promote-release-to-main:
    name: Promote release to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: [quality, database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create promotion pull request if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          TARGET_BRANCH: main
        shell: bash
        run: |
          set -euo pipefail
          existing_pr="$(gh pr list --repo "${GH_REPOSITORY}" --head "${HEAD_BRANCH}" --base "${TARGET_BRANCH}" --state open --json number --jq '.[0].number')"
          if [[ -n "${existing_pr}" ]]; then
            echo "Promotion PR #${existing_pr} already exists: ${HEAD_BRANCH} -> ${TARGET_BRANCH}"
            exit 0
          fi
          gh pr create --repo "${GH_REPOSITORY}" --head "${HEAD_BRANCH}" --base "${TARGET_BRANCH}" --title "Promote ${HEAD_BRANCH} to ${TARGET_BRANCH}" --body "Automated promotion for commit ${COMMIT_SHA}. CI checks passed on ${HEAD_BRANCH}."

# Deploy ownership:
# - GitHub Actions is the single production migration orchestrator.
# - Supabase GitHub Integration applies supabase/migrations on the configured production branch.
# - Vercel Git Integration deploys the develop preview/staging branch and main production.
# GitHub Actions must not apply production migrations; Prisma is ORM/client generation only.
# The final promote job opens feature/bugfix -> develop -> release -> main PRs.
