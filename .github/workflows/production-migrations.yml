name: Cheffia production migrations

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: cheffia-production-migrations
  cancel-in-progress: false

jobs:
  production-migrations:
    name: Deploy Prisma schema before Supabase integration
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply Prisma migrations before Supabase integration deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: bun run db:migrate:prisma:deploy
