# Canonical workflow: .github/workflows/pipeline.yml
#
# This file is kept as a discoverable pointer for tooling that scans the
# repository root. GitHub executes only the workflow under .github/workflows.
# Deploy ownership:
# - Vercel Git Integration publishes develop and main.
# - GitHub Actions runs quality gates, local database/RLS verification and the
#   serialized production migration orchestrator.
# - Supabase remains the owner of supabase/migrations, but its automatic production
#   migration deploy must be disabled to avoid duplicate execution.
